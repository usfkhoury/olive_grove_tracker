name: Deploy to production

on:
  push:
    branches: [main]
    # Docs-only changes don't affect the running app — skip the (slow,
    # downtime-incurring) redeploy for Markdown edits.
    paths-ignore:
      - '**.md'
  # Manual trigger: Actions tab → "Deploy to production" → "Run workflow"
  # (or `gh workflow run "Deploy to production"`). Redeploys current main.
  workflow_dispatch:

# checkout clones this private repo on the runner using GITHUB_TOKEN, which
# only needs read access. The VM never touches GitHub — the runner pushes the
# files to it over SSH — so no GitHub credential is ever stored on the server.
permissions:
  contents: read

# Don't let two pushes deploy at once and race on the VM.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a full commit SHA (not a moving tag)
      # so a compromised/retagged release can't run on the runner that holds
      # the SSH key. The fingerprint pins the VM's ECDSA host key (the type the
      # Go ssh client negotiates) so we never blind-trust an impostor host.
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Strip VCS metadata before copy
        # checkout writes .git/objects read-only with an ownership the
        # scp-action's tar container can't read ("Cannot open: Permission
        # denied"), failing the copy. The server builds from the copied source
        # and never needs .git, so drop it from the payload.
        run: rm -rf .git

      - name: Copy source to server
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: SHA256:TWkhkM+EZ2h4YnuPY05Kh8wHQpvnoIoXeJx5WGezGsw
          source: "."
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true

      - name: Build and restart
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        # App config is forwarded from GitHub Secrets into the remote shell, so
        # docker compose interpolates ${VAR} at build + run time. Nothing is
        # hand-maintained in a .env on the VM. VITE_GOOGLE_CLIENT_ID is consumed
        # by the frontend build arg; the rest are the backend's runtime env.
        env:
          OLIVE_SESSION_SECRET: ${{ secrets.OLIVE_SESSION_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          OLIVE_OWNER_EMAIL: ${{ secrets.OLIVE_OWNER_EMAIL }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: SHA256:TWkhkM+EZ2h4YnuPY05Kh8wHQpvnoIoXeJx5WGezGsw
          # Forward the secrets above into the remote script's environment.
          envs: OLIVE_SESSION_SECRET,GOOGLE_CLIENT_ID,VITE_GOOGLE_CLIENT_ID,OLIVE_OWNER_EMAIL
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            # Fail loudly if any required config is missing, rather than building
            # a container that 503s on login because a var interpolated to "".
            for v in OLIVE_SESSION_SECRET GOOGLE_CLIENT_ID VITE_GOOGLE_CLIENT_ID OLIVE_OWNER_EMAIL; do
              eval "val=\$$v"
              if [ -z "$val" ]; then echo "Missing required secret: $v" >&2; exit 1; fi
            done
            docker compose -f docker-compose.prod.yml build --no-cache
            # --force-recreate so Caddy re-reads its bind-mounted Caddyfile.
            # Plain `up -d` leaves the running Caddy on its old config.
            docker compose -f docker-compose.prod.yml up -d --force-recreate

            # Post-deploy health check: fail the job loudly if the site doesn't
            # come back. --resolve hits the local container directly (no hairpin
            # NAT dependency) while keeping the real hostname for SNI + a valid
            # TLS cert. Retry because --force-recreate briefly drops Caddy.
            echo "Waiting for the site to respond..."
            for i in $(seq 1 12); do
              if curl -fsS -o /dev/null --resolve olives.usfkhoury.com:443:127.0.0.1 https://olives.usfkhoury.com/; then
                echo "Health check passed."
                exit 0
              fi
              sleep 5
            done
            echo "Health check FAILED — site not responding 60s after deploy." >&2
            exit 1
