[build]
  base    = "."
  command = "cd frontend && npm ci && npm run build"
  publish = "frontend/dist"

[functions]
  directory    = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
