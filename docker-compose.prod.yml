services:
  olive:
    build: .
    restart: unless-stopped
    volumes:
      - ./data:/data
    environment:
      - OLIVE_DB=/data/olive.db

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - olive

volumes:
  caddy_data:
  caddy_config:
