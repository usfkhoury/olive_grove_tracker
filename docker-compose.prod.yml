services:
  olive:
    build:
      context: .
      args:
        # Baked into the frontend bundle at build time (see Dockerfile). Must be
        # set in the VM's .env alongside the runtime vars below.
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    restart: unless-stopped
    volumes:
      - ./data:/data
    environment:
      - OLIVE_DB=/data/olive.db
      - OLIVE_SESSION_SECRET=${OLIVE_SESSION_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - OLIVE_OWNER_EMAIL=${OLIVE_OWNER_EMAIL}
      - OLIVE_COOKIE_SECURE=true

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - olive

volumes:
  caddy_data:
  caddy_config:
